name: visa_infinite_access_sdk_flutter
description: >-
  Flutter wrapper for Visa Infinite Access, enabling cardholder benefit journeys on Android and iOS.
version: 0.0.1
repository: https://github.com/juspay/hyper-sdk-flutter
homepage: https://juspay.in/

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: in.juspay.hyper_sdk_flutter
        pluginClass: HyperSdkFlutterPlugin
      ios:
        pluginClass: HyperSdkFlutterPlugin
